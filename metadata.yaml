name: astrbot_plugin_private_companion
display_name: 我会永远陪着你
author: menglimi / wechat-bridge fork
version: 7.0.4a-wechat.4
repo: https://github.com/CyL-Cly/astrbot_plugin_private_companion_wechat
description: 将一切串联成角色的生活，一站式互联拟人化插件。本 fork 在上游 7.0.4a 基础上兼容 wechat_robot（wechat-robot-client）会话与 AstrBotPlatformSender 主动投递；插件 ID 仍为 astrbot_plugin_private_companion，以便对接 memory_companion。
desc: 上游拟人化陪伴插件 + wechat_robot 平台兼容（会话 UMO / 账号投影 / 主动消息走 AstrBot 会话发送）。插件 ID 不变。
help: |
  私聊功能指令：
  - 陪伴 帮助 / 状态 / 能力列表 / 日程 / 主动判定
  - 生成日程 / 刷新日程 / 重新生成日程
  - 陪伴 日记 / 梦境 / 记忆（线索）/ 长期记忆（线索）/ 片段（线索）/ 画像
  - 陪伴 答疑（问题）/ 陪伴画图（描述）/ 陪伴合照（修改要求）

  群聊功能指令：
  - 陪伴群 帮助 / 状态 / 话题
  - 陪伴群 黑话（词）/ 片段（线索）

  配置、授权、清空与重置操作请在「陪伴小屋」对应页面完成。聊天功能指令由 AstrBot 普通回复主链和本轮授权工具执行。
category: AI 增强
tags:
  - 陪伴
  - 角色扮演
  - 体素小屋
  - 能力整合
  - wechat_robot
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - wechat_robot
astrbot_version: ">=4.27.2"
